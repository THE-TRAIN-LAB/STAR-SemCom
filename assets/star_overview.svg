<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="16" fill="#FFFFFF"/>

  <!-- section labels -->
  <text x="40" y="38" font-size="15" font-weight="700" fill="#6B7280" letter-spacing="1.5">TRANSMITTER (edge device: robot / camera)</text>
  <text x="742" y="38" font-size="15" font-weight="700" fill="#6B7280" letter-spacing="1.5">5G NR UPLINK</text>
  <text x="935" y="38" font-size="15" font-weight="700" fill="#6B7280" letter-spacing="1.5">CONTROL CENTER</text>
  <line x1="715" y1="55" x2="715" y2="410" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="912" y1="55" x2="912" y2="410" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- input -->
  <rect x="30" y="160" width="150" height="110" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1.5"/>
  <text x="105" y="195" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">Image I</text>
  <text x="105" y="220" font-size="13" fill="#4B5563" text-anchor="middle">+ critical tasks</text>
  <text x="105" y="240" font-size="13" fill="#4B5563" text-anchor="middle">Q = {(q, ω_q)}</text>
  <text x="105" y="258" font-size="11.5" fill="#6B7280" text-anchor="middle" font-style="italic">"Is there a fire?"</text>

  <!-- SCI estimation -->
  <rect x="215" y="140" width="190" height="150" rx="12" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.8"/>
  <text x="310" y="170" font-size="16" font-weight="700" fill="#312E81" text-anchor="middle">SCI estimation</text>
  <text x="310" y="192" font-size="13" fill="#3730A3" text-anchor="middle">frozen Qwen2.5-VL</text>
  <text x="310" y="215" font-size="12.5" fill="#4B5563" text-anchor="middle">&lt;where&gt; decoder attention</text>
  <text x="310" y="234" font-size="12.5" fill="#4B5563" text-anchor="middle">→ per-pixel criticality S</text>
  <text x="310" y="262" font-size="12" fill="#6366F1" text-anchor="middle" font-weight="700">zero-shot · Alg. 1</text>
  <line x1="180" y1="215" x2="211" y2="215" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>

  <!-- base layer -->
  <rect x="455" y="75" width="230" height="110" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.8"/>
  <text x="570" y="103" font-size="16" font-weight="700" fill="#1E293B" text-anchor="middle">Base layer</text>
  <text x="570" y="126" font-size="13" fill="#334155" text-anchor="middle">whole image, downsample ↓D</text>
  <text x="570" y="146" font-size="13" fill="#334155" text-anchor="middle">uncoded high-order QAM</text>
  <text x="570" y="170" font-size="12" fill="#64748B" text-anchor="middle" font-style="italic">few REs, low fidelity</text>

  <!-- protection tier -->
  <rect x="455" y="245" width="230" height="120" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="570" y="273" font-size="16" font-weight="700" fill="#78350F" text-anchor="middle">Protection tier</text>
  <text x="570" y="296" font-size="13" fill="#92400E" text-anchor="middle">pixels with S = 2 only</text>
  <text x="570" y="316" font-size="13" fill="#92400E" text-anchor="middle">[ pos | R | G | B ] units</text>
  <text x="570" y="336" font-size="13" fill="#92400E" text-anchor="middle">conv. code r = 1/3 + BPSK</text>
  <text x="570" y="355" font-size="12" fill="#B45309" text-anchor="middle" font-style="italic">full resolution, strongly protected</text>

  <path d="M405,190 C430,190 430,130 451,130" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M405,240 C430,240 430,305 451,305" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#aa)"/>

  <!-- channel -->
  <rect x="735" y="150" width="155" height="130" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="812" y="182" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">OFDM link</text>
  <text x="812" y="205" font-size="13" fill="#4B5563" text-anchor="middle">3GPP TDL-A</text>
  <text x="812" y="225" font-size="13" fill="#4B5563" text-anchor="middle">LMMSE equalizer</text>
  <text x="812" y="252" font-size="12" fill="#6B7280" text-anchor="middle" font-style="italic">existing MCS chain,</text>
  <text x="812" y="268" font-size="12" fill="#6B7280" text-anchor="middle" font-style="italic">no new PHY</text>
  <path d="M685,130 C712,130 710,190 731,190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M685,305 C712,305 710,245 731,245" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#aa)"/>

  <!-- receiver -->
  <rect x="935" y="75" width="150" height="85" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="1010" y="105" font-size="14.5" font-weight="700" fill="#1E293B" text-anchor="middle">Hard demap</text>
  <text x="1010" y="127" font-size="13" fill="#334155" text-anchor="middle">upsample ↑D</text>
  <rect x="935" y="270" width="150" height="85" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1010" y="300" font-size="14.5" font-weight="700" fill="#78350F" text-anchor="middle">Soft demap</text>
  <text x="1010" y="322" font-size="13" fill="#92400E" text-anchor="middle">Viterbi decode</text>
  <path d="M890,190 C912,190 912,118 931,118" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M890,245 C912,245 912,312 931,312" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#aa)"/>

  <rect x="1115" y="150" width="140" height="130" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="1185" y="180" font-size="15" font-weight="700" fill="#064E3B" text-anchor="middle">Received Î</text>
  <text x="1185" y="203" font-size="12.5" fill="#065F46" text-anchor="middle">task-causal pixels</text>
  <text x="1185" y="221" font-size="12.5" fill="#065F46" text-anchor="middle">overwrite base</text>
  <text x="1185" y="250" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">full image kept</text>
  <text x="1185" y="267" font-size="12" fill="#059669" text-anchor="middle" font-weight="700">for audit</text>
  <path d="M1085,118 C1105,118 1100,190 1111,190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M1085,312 C1105,312 1100,245 1111,245" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#aa)"/>

  <!-- legend -->
  <line x1="40" y1="405" x2="70" y2="405" stroke="#475569" stroke-width="2.5"/>
  <text x="78" y="410" font-size="13" fill="#4B5563">task-invariant pixels (base layer)</text>
  <line x1="320" y1="405" x2="350" y2="405" stroke="#B45309" stroke-width="2.5"/>
  <text x="358" y="410" font-size="13" fill="#4B5563">task-causal pixels (protection tier)</text>
  <text x="1240" y="410" font-size="13" fill="#6B7280" text-anchor="end">Changing the critical tasks = editing the prompt, no retraining</text>
</svg>
